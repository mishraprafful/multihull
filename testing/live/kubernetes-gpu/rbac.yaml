apiVersion: v1
kind: Namespace
metadata:
  name: multihull-gpu
  labels:
    multihull.dev/managed-by: multihull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multihull-live
  namespace: multihull-gpu
---
apiVersion: v1
kind: Secret
metadata:
  name: multihull-live-token
  namespace: multihull-gpu
  annotations:
    kubernetes.io/service-account.name: multihull-live
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multihull-live
  namespace: multihull-gpu
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, create, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multihull-live
  namespace: multihull-gpu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: multihull-live
subjects:
  - kind: ServiceAccount
    name: multihull-live
    namespace: multihull-gpu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multihull-live-multihull-gpu
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [multihull-gpu]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multihull-live-multihull-gpu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multihull-live-multihull-gpu
subjects:
  - kind: ServiceAccount
    name: multihull-live
    namespace: multihull-gpu
