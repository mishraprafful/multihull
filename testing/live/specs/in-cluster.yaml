apiVersion: multihull/v1
name: in-cluster-local

container:
  image: multihull-mock-server:live
  command: [/app/.venv/bin/python, -m, mock_server]
  port: 8000
  health: {path: /health, initialDelaySeconds: 2}
  env: {MOCK_MODEL: mock-llm}

resources:
  gpu: []
  memory: 256Mi

scaling:
  concurrency: 32
  replicas: {min: 1, max: 1}

reliability:
  minWarmProviders: 1

targets:
  - provider: kind
    type: kubernetes
    priority: 1
    kubernetes:
      namespace: multihull-workload
      serviceType: ClusterIP

route:
  hostname: llama.local
  protocol: openai
  failover: {policy: priority, retryOn: [5xx, timeout, capacity], maxRetries: 2}
