router:
  image:
    repository: ghcr.io/mishraprafful/multihull-router
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  listen: 8080
  admin: 9090
  region: ""
  snapshot:
    type: file
    value: /var/lib/multihull/snapshot.json
  tls:
    secretName: ""
  tuning:
    timeouts:
      connect: 2
      first_byte: 30
      idle: 60
      total: 600
    circuit:
      consecutive_failures: 5
      error_ratio: 0.5
      ratio_window: 10
      min_samples: 20
      base_backoff: 5
      max_backoff: 300
      jitter_fraction: 0.25
      half_open_ramp: 30
      probe_successes_to_close: 3
      provider_open_ratio: 0.5
      panic_threshold: 0.5
    admission:
      max_wait: 5
      bound: 1024
    pressure:
      queue_wait_fraction: 0.5
      sustained: 2
      stale_after: 10
      ttft_degrade_factor: 2.0
      ttft_window: 50
      ttft_baseline_smoothing: 0.2
    probe:
      enabled: true
      interval: 5
      timeout: 2
      jitter_fraction: 0.2
      failure_threshold: 3
      success_threshold: 3
    retry:
      budget_ratio: 0.2
      budget_window: 10
      min_retries_per_second: 10
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraConfig: ""

controller:
  enabled: false
  image:
    repository: ghcr.io/mishraprafful/multihull
    tag: ""
    pullPolicy: IfNotPresent
  stateBackend:
    existingSecret: ""
    key: url
  specConfigMap: ""
  grpcPort: 9443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

nameOverride: ""
fullnameOverride: ""
