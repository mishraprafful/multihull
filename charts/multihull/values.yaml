router:
  image:
    repository: ghcr.io/mishraprafful/multihull-router
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  listen: 8080
  admin: 9090
  region: ""
  # Where the router reads endpoint snapshots. Snapshots can carry provider
  # credentials (Modal proxy tokens), so grpc and http sources need TLS or an
  # explicit insecure opt-in.
  snapshot:
    # file, grpc or http.
    type: file
    # file: snapshot path. grpc: controller host:port; leave the default to use
    # the in-chart controller. http: http:// or https:// URL.
    value: /var/lib/multihull/snapshot.json
    tls:
      # Secret mounted at /etc/multihull/discovery for grpc and https sources:
      # ca.crt is the only CA trusted for the source and, with clientCertificate,
      # tls.crt and tls.key are the router's mTLS client certificate. A grpc
      # source becomes grpcs:// when this is set.
      secretName: ""
      clientCertificate: true
    token:
      # Secret holding the bootstrap token the router sends as
      # "authorization: Bearer"; exposed as MULTIHULL_DISCOVERY_TOKEN.
      existingSecret: ""
      key: token
    # Allow a plaintext grpc:// or http:// source. Local development only.
    insecure: false
  tls:
    secretName: ""
  # router.toml tuning tables, see router/router.example.toml. Durations are
  # seconds as numbers (1.5, not "1.5s"). Set to null to use the router defaults.
  tuning:
    timeouts:
      connect: 2
      first_byte: 30
      idle: 60
      total: 600
    circuit:
      consecutive_failures: 5
      error_ratio: 0.5
      ratio_window: 10
      min_samples: 20
      base_backoff: 5
      max_backoff: 300
      jitter_fraction: 0.25
      half_open_ramp: 30
      probe_successes_to_close: 3
      provider_open_ratio: 0.5
      panic_threshold: 0.5
    admission:
      max_wait: 5
      bound: 1024
    pressure:
      queue_wait_fraction: 0.5
      sustained: 2
      resend_every: 30
      stale_after: 10
      ttft_degrade_factor: 2.0
      ttft_window: 50
      ttft_baseline_smoothing: 0.2
      ttft_rebaseline_after: 3600
    probe:
      enabled: true
      interval: 5
      timeout: 2
      jitter_fraction: 0.2
      failure_threshold: 3
      success_threshold: 3
    retry:
      budget_ratio: 0.2
      budget_window: 10
      min_retries_per_second: 10
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Raw TOML for router.toml settings the chart does not render, such as
  # upstream_ca, max_buffered_body_bytes, node_id or a [log] table. Keys before
  # the first [table] header are placed with the top-level keys; tables are
  # appended after the generated ones. Do not repeat a key or table the chart
  # already renders (listen, admin_listen, region, [snapshot], [tls], tuning
  # tables): TOML rejects duplicates. Example:
  #   extraConfig: |
  #     max_buffered_body_bytes = 4194304
  #     node_id = "router-eu"
  #
  #     [log]
  #     format = "json"
  extraConfig: ""

controller:
  enabled: false
  image:
    repository: ghcr.io/mishraprafful/multihull-controller
    tag: ""
    pullPolicy: IfNotPresent
  # Secret whose key holds MULTIHULL_STATE_BACKEND. SQLite is the only backend
  # today: a path or sqlite:///absolute/path.db.
  stateBackend:
    existingSecret: ""
    key: url
    # Volume mounted at /var/lib/multihull/state for the SQLite file, such as
    # {persistentVolumeClaim: {claimName: multihull-state}} with the URL
    # sqlite:///var/lib/multihull/state/state.db. Without one a restart loses it.
    volume: {}
  specConfigMap: ""
  # Provider credentials as environment variables, such as
  # [{secretRef: {name: modal-credentials}}] holding MODAL_TOKEN_ID and
  # MODAL_TOKEN_SECRET. Kubernetes targets without a context use the pod's
  # service account; the chart creates no RBAC for it.
  envFrom: []
  grpcPort: 9443
  # The discovery stream needs TLS unless insecure is true.
  tls:
    # Secret with tls.crt and tls.key the stream serves. Its SAN must match the
    # host routers dial, <release>-multihull-controller by default.
    secretName: ""
    # Secret with ca.crt; routers must present a client certificate it signed (mTLS).
    clientCaSecret: ""
  token:
    # Secret holding the bootstrap token checked on every stream; exposed as
    # MULTIHULL_DISCOVERY_TOKEN. TLS needs clientCaSecret, this token or both.
    existingSecret: ""
    key: token
  # Serve the stream in plaintext (hull controller --insecure). Local development only.
  insecure: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

nameOverride: ""
fullnameOverride: ""
