    pressure:
      queue_wait_fraction: 0.75
      sustained: 3
      stale_after: 15
      ttft_degrade_factor: 3.5
      ttft_window: 100
      ttft_baseline_smoothing: 0.1
    probe:
      enabled: false
      interval: 10
      timeout: 0.75
      jitter_fraction: 0.3
      failure_threshold: 5
      success_threshold: 2
    retry:
      budget_ratio: 0.3
      budget_window: 30
      min_retries_per_second: 20
