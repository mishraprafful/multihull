{{- $extraConfig := .Values.router.extraConfig | default "" }}
{{- if not (kindIs "string" $extraConfig) }}
{{- fail "router.extraConfig must be a string of TOML" }}
{{- end }}
{{- $extraTables := regexFind "(?m)^[ \\t]*\\[(?s:.*)" $extraConfig }}
{{- $extraTopLevel := trimSuffix $extraTables $extraConfig | trim -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multihull.fullname" . }}-router
  labels:
    {{- include "multihull.labels" . | nindent 4 }}
data:
  router.toml: |
    listen = "0.0.0.0:{{ .Values.router.listen }}"
    admin_listen = "0.0.0.0:{{ .Values.router.admin }}"
    {{- with .Values.router.region }}
    region = {{ . | quote }}
    {{- end }}
    {{- with $extraTopLevel }}
    {{ . | indent 4 | trim }}
    {{- end }}

    [snapshot]
    {{- $snapshot := .Values.router.snapshot }}
    {{- $tlsSecret := include "multihull.snapshotTlsSecret" . }}
    {{- $tokenSecret := include "multihull.snapshotTokenSecret" . }}
    {{- if eq $snapshot.type "file" }}
    {{- if or $tlsSecret $tokenSecret $snapshot.insecure }}
    {{- fail "router.snapshot.tls, router.snapshot.token and router.snapshot.insecure apply to grpc and http sources, not to a snapshot file" }}
    {{- end }}
    source = {{ printf "file://%s" $snapshot.value | quote }}
    {{- else }}
    {{- $source := include "multihull.snapshotSource" . }}
    {{- $plaintext := or (hasPrefix "grpc://" $source) (hasPrefix "http://" $source) }}
    {{- if and $snapshot.insecure $tlsSecret }}
    {{- fail "router.snapshot.insecure cannot be combined with router.snapshot.tls.secretName" }}
    {{- end }}
    {{- if and $plaintext (not $snapshot.insecure) }}
    {{- fail (printf "router.snapshot source %s is plaintext and the snapshot can carry provider credentials: set router.snapshot.tls.secretName (grpc) or use an https:// URL (http), or set router.snapshot.insecure=true for local development only" $source) }}
    {{- end }}
    {{- if and (not $plaintext) $snapshot.insecure }}
    {{- fail "router.snapshot.insecure only permits plaintext grpc:// and http:// sources" }}
    {{- end }}
    source = {{ $source | quote }}
    {{- if $tlsSecret }}
    ca = "/etc/multihull/discovery/ca.crt"
    {{- if $snapshot.tls.clientCertificate }}
    client_cert = "/etc/multihull/discovery/tls.crt"
    client_key = "/etc/multihull/discovery/tls.key"
    {{- end }}
    {{- end }}
    {{- if $tokenSecret }}
    token_env = {{ include "multihull.tokenEnv" . | quote }}
    {{- end }}
    {{- if $snapshot.insecure }}
    insecure = true
    {{- end }}
    {{- end }}
    {{- if .Values.router.tls.secretName }}

    [tls]
    cert = "/etc/multihull/tls/tls.crt"
    key = "/etc/multihull/tls/tls.key"
    {{- end }}
    {{- $tuning := .Values.router.tuning | default dict }}
    {{- range $table := list "timeouts" "circuit" "admission" "pressure" "probe" "retry" }}
    {{- with index $tuning $table }}

    [{{ $table }}]
    {{- range $key, $value := . }}
    {{ $key }} = {{ include "multihull.tomlValue" $value }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with $extraTables }}

    {{ . | indent 4 | trim }}
    {{- end }}
