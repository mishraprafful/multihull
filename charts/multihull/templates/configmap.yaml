apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multihull.fullname" . }}-router
  labels:
    {{- include "multihull.labels" . | nindent 4 }}
data:
  router.toml: |
    listen = "0.0.0.0:{{ .Values.router.listen }}"
    admin_listen = "0.0.0.0:{{ .Values.router.admin }}"
    {{- with .Values.router.region }}
    region = {{ . | quote }}
    {{- end }}

    [snapshot]
    {{- if eq .Values.router.snapshot.type "file" }}
    source = {{ printf "file://%s" .Values.router.snapshot.value | quote }}
    {{- else if eq .Values.router.snapshot.type "http" }}
    source = {{ .Values.router.snapshot.value | quote }}
    {{- else if eq .Values.router.snapshot.type "grpc" }}
    {{- if and .Values.controller.enabled (not .Values.router.snapshot.value) }}
    source = {{ printf "grpc://%s-controller:%v" (include "multihull.fullname" .) .Values.controller.grpcPort | quote }}
    {{- else }}
    source = {{ printf "grpc://%s" .Values.router.snapshot.value | quote }}
    {{- end }}
    {{- else }}
    {{- fail (printf "router.snapshot.type must be file, http or grpc, got %q" .Values.router.snapshot.type) }}
    {{- end }}
    {{- if .Values.router.tls.secretName }}

    [tls]
    cert = "/etc/multihull/tls/tls.crt"
    key = "/etc/multihull/tls/tls.key"
    {{- end }}
    {{- range $table := list "timeouts" "circuit" "admission" "pressure" "probe" "retry" }}
    {{- with index $.Values.router.tuning $table }}

    [{{ $table }}]
    {{- range $key, $value := . }}
    {{ $key }} = {{ $value }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.router.extraConfig }}

    {{ . | indent 4 | trim }}
    {{- end }}
