{{- if .Values.controller.enabled }}
{{- $tls := .Values.controller.tls | default dict }}
{{- $token := .Values.controller.token | default dict }}
{{- if and .Values.controller.insecure (or $tls.secretName $tls.clientCaSecret) }}
{{- fail "controller.insecure cannot be combined with controller.tls" }}
{{- end }}
{{- if and (not .Values.controller.insecure) (not $tls.secretName) }}
{{- fail "controller.tls.secretName is required: the discovery stream carries provider credentials. Point it at a Secret with tls.crt and tls.key, or set controller.insecure=true for local development only" }}
{{- end }}
{{- if and $tls.secretName (not $tls.clientCaSecret) (not $token.existingSecret) }}
{{- fail "controller.tls needs controller.tls.clientCaSecret (mTLS), controller.token.existingSecret or both to authenticate routers" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multihull.fullname" . }}-controller
  labels:
    {{- include "multihull.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "multihull.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "multihull.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "multihull.serviceAccountName" . }}
      containers:
        - name: controller
          image: {{ include "multihull.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command:
            - hull
            - controller
            - "/etc/multihull/multihull.yaml"
            - "--grpc-listen"
            - "0.0.0.0:{{ .Values.controller.grpcPort }}"
            {{- if .Values.controller.insecure }}
            - "--insecure"
            {{- end }}
            {{- if $tls.secretName }}
            - "--tls-cert"
            - "/etc/multihull/discovery/tls/tls.crt"
            - "--tls-key"
            - "/etc/multihull/discovery/tls/tls.key"
            {{- end }}
            {{- if $tls.clientCaSecret }}
            - "--client-ca"
            - "/etc/multihull/discovery/client-ca/ca.crt"
            {{- end }}
            - "--token-env"
            - {{ include "multihull.tokenEnv" . | quote }}
          ports:
            - name: grpc
              containerPort: {{ .Values.controller.grpcPort }}
              protocol: TCP
          env:
            - name: MULTIHULL_STATE_BACKEND
              valueFrom:
                secretKeyRef:
                  name: {{ required "controller.stateBackend.existingSecret is required when controller.enabled" .Values.controller.stateBackend.existingSecret }}
                  key: {{ .Values.controller.stateBackend.key }}
            {{- with $token.existingSecret }}
            - name: {{ include "multihull.tokenEnv" $ }}
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $token.key | default "token" }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if or .Values.controller.specConfigMap $tls.secretName $tls.clientCaSecret }}
          volumeMounts:
            {{- if .Values.controller.specConfigMap }}
            - name: spec
              mountPath: /etc/multihull/multihull.yaml
              subPath: multihull.yaml
              readOnly: true
            {{- end }}
            {{- if $tls.secretName }}
            - name: discovery-tls
              mountPath: /etc/multihull/discovery/tls
              readOnly: true
            {{- end }}
            {{- if $tls.clientCaSecret }}
            - name: discovery-client-ca
              mountPath: /etc/multihull/discovery/client-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.controller.specConfigMap $tls.secretName $tls.clientCaSecret }}
      volumes:
        {{- with .Values.controller.specConfigMap }}
        - name: spec
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with $tls.secretName }}
        - name: discovery-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with $tls.clientCaSecret }}
        - name: discovery-client-ca
          secret:
            secretName: {{ . }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multihull.fullname" . }}-controller
  labels:
    {{- include "multihull.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    {{- include "multihull.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- end }}
