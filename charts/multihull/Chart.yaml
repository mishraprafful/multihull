apiVersion: v2
name: multihull
description: Multihull router and optional controller
type: application
version: 0.2.0
appVersion: "0.2.0"
home: https://multihull.pages.dev
sources:
  - https://github.com/mishraprafful/multihull
keywords:
  - gpu
  - inference
  - router
  - failover
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://multihull.pages.dev
    - name: Source
      url: https://github.com/mishraprafful/multihull
    - name: support
      url: https://github.com/mishraprafful/multihull/issues
  artifacthub.io/images: |
    - name: router
      image: ghcr.io/mishraprafful/multihull-router:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: controller
      image: ghcr.io/mishraprafful/multihull-controller:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: added
      description: The chart creates the workloads Namespace (workloads.namespace, default multihull, kept on uninstall) and skips it when it is the release namespace
      links:
        - name: Release notes
          url: https://github.com/mishraprafful/multihull/blob/main/docs/releases/0.2.0.md
        - name: Changelog
          url: https://github.com/mishraprafful/multihull/blob/main/CHANGELOG.md
    - kind: changed
      description: The router and controller images are published for linux/amd64 and linux/arm64
