home: https://multihull.pages.dev
sources:
  - https://github.com/mishraprafful/multihull
keywords:
  - gpu
  - inference
  - router
  - failover
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://multihull.pages.dev
    - name: Source
      url: https://github.com/mishraprafful/multihull
    - name: support
      url: https://github.com/mishraprafful/multihull/issues
  artifacthub.io/images: |
    - name: router
      image: ghcr.io/mishraprafful/multihull-router:0.3.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: controller
      image: ghcr.io/mishraprafful/multihull-controller:0.3.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: changed
      description: Router and controller 0.3.0, which add RunPod, Baseten and Replicate targets and per-target credential overrides; templates and values are unchanged
      links:
        - name: Release notes
          url: https://github.com/mishraprafful/multihull/blob/main/docs/releases/0.3.0.md
        - name: Changelog
          url: https://github.com/mishraprafful/multihull/blob/main/CHANGELOG.md
    - kind: changed
      description: The router answers 400 to a request target with a dot segment and forwards only POST /predictions to Replicate endpoints
