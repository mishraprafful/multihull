apiVersion: multihull/v1
name: replicate-echo

container:
  build: {context: ., target: cog}
  port: 5000
  health: {path: /health-check, initialDelaySeconds: 5}

resources:
  gpu: []

scaling:
  replicas: {min: 1, max: 2}

targets:
  - provider: local
    type: docker
    priority: 1
    docker: {pull: false}
  - provider: replicate
    type: replicate
    priority: 2

route:
  hostname: echo.local
  protocol: http
  failover: {policy: priority, retryOn: [5xx, timeout, capacity], maxRetries: 2}
