version: 2
updates:
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: cargo
    directory: /router
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directories:
      - /python
      - /router
      - /testing/mock-server
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
