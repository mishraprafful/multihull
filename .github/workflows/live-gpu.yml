name: Live GPU

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Abort and destroy once the suite has run this many minutes (1 to 30)
        default: '20'
        type: string

permissions:
  contents: read

env:
  MODAL_ENVIRONMENT: main
  APP_PREFIX: multihull-live-
  MODAL_IMAGE_BUILDER_VERSION: '2025.06'

jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: live-gpu
      cancel-in-progress: false
    env:
      LIVE_SPEC: gpu-modal
      LIVE_SERVICE: live-${{ github.run_id }}
      LIVE_MAX_MINUTES: ${{ inputs.max_minutes }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check max_minutes fits the job timeout
        run: |
          case "$LIVE_MAX_MINUTES" in
            ''|*[!0-9]*) echo "::error::max_minutes must be a whole number of minutes"; exit 1 ;;
          esac
          if [ "$LIVE_MAX_MINUTES" -lt 1 ] || [ "$LIVE_MAX_MINUTES" -gt 30 ]; then
            echo "::error::max_minutes must be between 1 and 30 (job timeout is 40 minutes)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Modal credential preflight
        id: preflight
        working-directory: testing/live
        run: uv run python -m live.preflight
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
      - run: cargo build --release -p multihull
        working-directory: router
      - name: Doctor, deploy, inference, logs, failover to the secondary, destroy
        timeout-minutes: 35
        run: >
          uv run --project testing/live pytest -q -x
          -c testing/live/pyproject.toml testing/live/tests/gpu
          --junitxml "$RUNNER_TEMP/live/results.xml"
        env:
          LIVE_ROUTER_BIN: ${{ github.workspace }}/router/target/release/multihull
          LIVE_WORKDIR: ${{ runner.temp }}/live
      - name: Destroy
        if: always()
        run: |
          workdir="$RUNNER_TEMP/live"
          mkdir -p "$workdir/logs"
          if [ -f "$workdir/multihull.yaml" ]; then
            cd "$workdir"
            uv run --project "$GITHUB_WORKSPACE/testing/live" hull destroy multihull.yaml --yes \
              --state .multihull/state.db --snapshot-out .multihull/snapshot.json 2>&1 \
              | tee logs/workflow-destroy.log
          else
            echo "no rendered spec; nothing to destroy" | tee "$workdir/logs/workflow-destroy.log"
          fi
      - name: Stop Modal apps left by this run
        if: always()
        working-directory: testing/live
        env:
          CREDENTIALS: ${{ steps.preflight.outputs.credentials }}
        run: |
          log="$RUNNER_TEMP/live/logs/backstop.log"
          mkdir -p "$(dirname "$log")"
          if [ "$CREDENTIALS" != accepted ]; then
            echo "skipped, credentials ${CREDENTIALS:-unchecked}" | tee "$log"
            exit 0
          fi
          uv run python -m live.sweep --prefix "${APP_PREFIX}${GITHUB_RUN_ID}" \
            --env "$MODAL_ENVIRONMENT" | tee "$log"
      - name: Job summary
        if: always()
        working-directory: testing/live
        run: >
          uv run python -m live.summary publish --workdir "$RUNNER_TEMP/live"
          --job-status "$JOB_STATUS" --artifact live-gpu-logs --spec gpu-modal
          --service "$LIVE_SERVICE"
        env:
          JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-gpu-logs
          path: |
            ${{ runner.temp }}/live/logs
            ${{ runner.temp }}/live/multihull.yaml
            ${{ runner.temp }}/live/router.toml
            ${{ runner.temp }}/live/summary.md
            ${{ runner.temp }}/live/summary.json
            ${{ runner.temp }}/live/results.xml
          if-no-files-found: ignore
