name: Live smoke

on:
  workflow_dispatch:
    inputs:
      mock_image:
        description: Mock server image that Modal pulls and kind loads
        default: ghcr.io/mishraprafful/multihull-mock-server:main
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  KIND_CLUSTER: multihull-live
  MODAL_ENVIRONMENT: main
  APP_PREFIX: multihull-live-

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.action == 'labeled' && github.event.label.name == 'live-smoke') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'live-smoke'))
    runs-on: ubuntu-24.04
    outputs:
      modal: ${{ steps.check.outputs.modal }}
      runpod: ${{ steps.runpod.outputs.enabled }}
    steps:
      - id: check
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then
            echo "modal=true" >> "$GITHUB_OUTPUT"
          else
            echo "modal=false" >> "$GITHUB_OUTPUT"
            echo "MODAL_TOKEN_ID or MODAL_TOKEN_SECRET is not available; skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: runpod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -n "$RUNPOD_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "RUNPOD_API_KEY is not available; the RunPod target was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    needs: gate
    if: needs.gate.outputs.modal == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    concurrency:
      group: live-smoke
      cancel-in-progress: false
    env:
      MOCK_IMAGE: ${{ inputs.mock_image || 'ghcr.io/mishraprafful/multihull-mock-server:main' }}
      LIVE_SPEC: kind-modal
      LIVE_SERVICE: live-${{ github.run_id }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Modal credential preflight
        id: preflight
        working-directory: testing/live
        run: uv run python -m live.preflight
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: testing/live/kind-config.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
      - run: cargo build --release -p multihull
        working-directory: router
      - run: docker build -t "$MOCK_IMAGE" testing/mock-server
      - run: kind load docker-image "$MOCK_IMAGE" --name "$KIND_CLUSTER"
      - name: Doctor, deploy, baseline, failover to Modal, recovery, logs, destroy
        timeout-minutes: 22
        run: >
          uv run --project testing/live pytest -q -x
          -c testing/live/pyproject.toml testing/live/tests
          --junitxml "$RUNNER_TEMP/live/results.xml"
        env:
          LIVE_MOCK_IMAGE: ${{ env.MOCK_IMAGE }}
          LIVE_ROUTER_BIN: ${{ github.workspace }}/router/target/release/multihull
          LIVE_WORKDIR: ${{ runner.temp }}/live
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Destroy
        if: always()
        run: |
          workdir="$RUNNER_TEMP/live"
          mkdir -p "$workdir/logs"
          if [ -f "$workdir/multihull.yaml" ]; then
            cd "$workdir"
            uv run --project "$GITHUB_WORKSPACE/testing/live" hull destroy multihull.yaml --yes \
              --state .multihull/state.db --snapshot-out .multihull/snapshot.json 2>&1 \
              | tee logs/workflow-destroy.log
          else
            echo "no rendered spec; nothing to destroy" | tee "$workdir/logs/workflow-destroy.log"
          fi
      - name: Stop Modal apps left by this run
        if: always()
        working-directory: testing/live
        env:
          CREDENTIALS: ${{ steps.preflight.outputs.credentials }}
        run: |
          log="$RUNNER_TEMP/live/logs/backstop.log"
          mkdir -p "$(dirname "$log")"
          if [ "$CREDENTIALS" != accepted ]; then
            echo "skipped, credentials ${CREDENTIALS:-unchecked}" | tee "$log"
            exit 0
          fi
          uv run python -m live.sweep --prefix "${APP_PREFIX}${GITHUB_RUN_ID}" \
            --env "$MODAL_ENVIRONMENT" | tee "$log"
      - name: Job summary
        if: always()
        working-directory: testing/live
        run: >
          uv run python -m live.summary publish --workdir "$RUNNER_TEMP/live"
          --job-status "$JOB_STATUS" --artifact live-smoke-logs --spec kind-modal
        env:
          JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-smoke-logs
          path: |
            ${{ runner.temp }}/live/logs
            ${{ runner.temp }}/live/multihull.yaml
            ${{ runner.temp }}/live/router.toml
            ${{ runner.temp }}/live/summary.md
            ${{ runner.temp }}/live/summary.json
            ${{ runner.temp }}/live/results.xml
          if-no-files-found: ignore

  runpod-smoke:
    needs: gate
    if: needs.gate.outputs.runpod == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: live-smoke-runpod
      cancel-in-progress: false
    env:
      MOCK_IMAGE: ${{ inputs.mock_image || 'ghcr.io/mishraprafful/multihull-mock-server:main' }}
      LIVE_SPEC: kind-runpod
      LIVE_SERVICE: live-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: testing/live/kind-config.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
      - run: cargo build --release -p multihull
        working-directory: router
      - run: docker build -t "$MOCK_IMAGE" testing/mock-server
      - run: kind load docker-image "$MOCK_IMAGE" --name "$KIND_CLUSTER"
      - name: Doctor, deploy, baseline, failover to RunPod, recovery, logs, destroy
        timeout-minutes: 22
        run: >
          uv run --project testing/live pytest -q -x
          -c testing/live/pyproject.toml testing/live/tests
          --junitxml "$RUNNER_TEMP/live/results.xml"
        env:
          LIVE_MOCK_IMAGE: ${{ env.MOCK_IMAGE }}
          LIVE_ROUTER_BIN: ${{ github.workspace }}/router/target/release/multihull
          LIVE_WORKDIR: ${{ runner.temp }}/live
      - name: Destroy
        if: always()
        run: |
          workdir="$RUNNER_TEMP/live"
          mkdir -p "$workdir/logs"
          if [ -f "$workdir/multihull.yaml" ]; then
            cd "$workdir"
            uv run --project "$GITHUB_WORKSPACE/testing/live" hull destroy multihull.yaml --yes \
              --state .multihull/state.db --snapshot-out .multihull/snapshot.json 2>&1 \
              | tee logs/workflow-destroy.log
          else
            echo "no rendered spec; nothing to destroy" | tee "$workdir/logs/workflow-destroy.log"
          fi
      - name: Delete RunPod endpoints left by this run
        if: always()
        working-directory: testing/live
        run: |
          log="$RUNNER_TEMP/live/logs/runpod-backstop.log"
          mkdir -p "$(dirname "$log")"
          uv run python -m live.runpod_sweep --prefix "${APP_PREFIX}${GITHUB_RUN_ID}" | tee "$log"
      - name: Job summary
        if: always()
        working-directory: testing/live
        run: >
          uv run python -m live.summary publish --workdir "$RUNNER_TEMP/live"
          --job-status "$JOB_STATUS" --artifact live-smoke-runpod-logs --spec kind-runpod
        env:
          JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-smoke-runpod-logs
          path: |
            ${{ runner.temp }}/live/logs
            ${{ runner.temp }}/live/multihull.yaml
            ${{ runner.temp }}/live/router.toml
            ${{ runner.temp }}/live/summary.md
            ${{ runner.temp }}/live/summary.json
            ${{ runner.temp }}/live/results.xml
          if-no-files-found: ignore

  modal-conformance:
    needs: gate
    if: needs.gate.outputs.modal == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: live-smoke-conformance-modal
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MULTIHULL_CONFORMANCE_PREFIX: live-c${{ github.run_id }}
      MULTIHULL_CONFORMANCE_IMAGE: ${{ inputs.mock_image || 'ghcr.io/mishraprafful/multihull-mock-server:main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Modal credential preflight
        id: preflight
        working-directory: testing/live
        run: uv run python -m live.preflight
      - name: Translator conformance against Modal
        timeout-minutes: 35
        working-directory: python
        run: uv run --project ../testing/live pytest -v tests/test_conformance.py
        env:
          MULTIHULL_CONFORMANCE_LIVE: modal
      - name: Stop Modal apps left by this run
        if: always()
        working-directory: testing/live
        env:
          CREDENTIALS: ${{ steps.preflight.outputs.credentials }}
        run: |
          if [ "$CREDENTIALS" != accepted ]; then
            echo "skipped, credentials ${CREDENTIALS:-unchecked}"
            exit 0
          fi
          uv run python -m live.sweep --prefix "multihull-${MULTIHULL_CONFORMANCE_PREFIX}" \
            --env "$MODAL_ENVIRONMENT"

  runpod-conformance:
    needs: gate
    if: needs.gate.outputs.runpod == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: live-smoke-conformance-runpod
      cancel-in-progress: false
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MULTIHULL_CONFORMANCE_PREFIX: live-c${{ github.run_id }}
      MULTIHULL_CONFORMANCE_IMAGE: ${{ inputs.mock_image || 'ghcr.io/mishraprafful/multihull-mock-server:main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Translator conformance against RunPod
        timeout-minutes: 50
        working-directory: python
        run: uv run --project ../testing/live pytest -v tests/test_conformance.py
        env:
          MULTIHULL_CONFORMANCE_LIVE: runpod
      - name: Delete RunPod endpoints left by this run
        if: always()
        working-directory: testing/live
        run: uv run python -m live.runpod_sweep --prefix "multihull-${MULTIHULL_CONFORMANCE_PREFIX}"

  sweep:
    needs: gate
    if: needs.gate.outputs.modal == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Modal credential preflight
        id: preflight
        working-directory: testing/live
        run: uv run python -m live.preflight
      - name: Stop live apps older than two hours
        if: ${{ !cancelled() }}
        working-directory: testing/live
        env:
          CREDENTIALS: ${{ steps.preflight.outputs.credentials }}
        run: |
          if [ "$CREDENTIALS" != accepted ]; then
            echo "skipped, credentials ${CREDENTIALS:-unchecked}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run python -m live.sweep --prefix "$APP_PREFIX" --older-than 7200 \
            --env "$MODAL_ENVIRONMENT" | tee -a "$GITHUB_STEP_SUMMARY"

  runpod-sweep:
    needs: gate
    if: needs.gate.outputs.runpod == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/live/uv.lock
            python/uv.lock
      - run: uv sync --locked --project testing/live
      - name: Delete live RunPod endpoints older than two hours
        working-directory: testing/live
        run: |
          uv run python -m live.runpod_sweep --prefix "$APP_PREFIX" --older-than 7200 \
            | tee -a "$GITHUB_STEP_SUMMARY"
