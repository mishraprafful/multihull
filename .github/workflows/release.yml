name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*

  router:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: multihull-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: multihull-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: multihull-darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p multihull --target ${{ matrix.target }}
      - run: >
          install -m 755
          target/${{ matrix.target }}/release/multihull
          ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: router/${{ matrix.asset }}

  github-release:
    needs: [python, router]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true

  publish-pypi:
    needs: github-release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    needs: github-release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
