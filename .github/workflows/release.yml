name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*

  router:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: multihull-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: multihull-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: multihull-darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p multihull --target ${{ matrix.target }}
      - run: >
          install -m 755
          target/${{ matrix.target }}/release/multihull
          ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: router/${{ matrix.asset }}

  github-release:
    needs: [python, router]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true

  publish-pypi:
    needs: github-release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    needs: github-release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - run: cargo publish -p multihull --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  publish-chart:
    needs: github-release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGES: ghcr.io/mishraprafful/multihull-router ghcr.io/mishraprafful/multihull-controller
      CHART_REGISTRY: oci://ghcr.io/mishraprafful/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: charts/package.sh "$GITHUB_REF_NAME" dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the router and controller images this chart defaults to
        run: |
          for _ in $(seq 60); do
            missing=""
            for repository in $IMAGES; do
              image="$repository:${GITHUB_REF_NAME#v}"
              docker buildx imagetools inspect "$image" > /dev/null 2>&1 || missing="$missing $image"
            done
            if [ -z "$missing" ]; then exit 0; fi
            sleep 30
          done
          echo "not published within 30 minutes:$missing" >&2
          exit 1
      - run: printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: helm push "dist/multihull-${GITHUB_REF_NAME#v}.tgz" "$CHART_REGISTRY"
      - name: Skip the Artifact Hub metadata until the repository is registered
        if: vars.ARTIFACTHUB_REPOSITORY_ID == ''
        run: echo "::notice::ARTIFACTHUB_REPOSITORY_ID is unset, not pushing charts/artifacthub-repo.yml"
      - uses: oras-project/setup-oras@v2.0.2
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        with:
          version: 1.3.4
      - name: Push the Artifact Hub metadata next to the chart
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        env:
          ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          charts/artifacthub-metadata.sh "$ARTIFACTHUB_REPOSITORY_ID" "$RUNNER_TEMP/artifacthub"
          cd "$RUNNER_TEMP/artifacthub"
          oras push "${CHART_REGISTRY#oci://}/multihull:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
