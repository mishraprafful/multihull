name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}
      router: ${{ steps.filter.outputs.router }}
      website: ${{ steps.filter.outputs.website }}
      chart: ${{ steps.filter.outputs.chart }}
      mock_server: ${{ steps.filter.outputs.mock_server }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            router:
              - 'router/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'docs/design/**'
              - 'python/multihull/**'
              - 'python/pyproject.toml'
              - 'python/uv.lock'
              - '.github/workflows/ci.yml'
            chart:
              - 'charts/**'
              - '.github/workflows/ci.yml'
            mock_server:
              - 'testing/mock-server/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'python/**'
              - 'router/**'
              - 'proto/**'
              - 'testing/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  router:
    needs: changes
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/multihull
      - run: helm template multihull charts/multihull > /dev/null
      - run: >
          helm template multihull charts/multihull
          --set controller.enabled=true
          --set controller.stateBackend.existingSecret=multihull-state
          --set controller.specConfigMap=multihull-spec
          > /dev/null

  mock-server:
    needs: changes
    if: needs.changes.outputs.mock_server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: testing/mock-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/mock-server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            testing/e2e/uv.lock
            python/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router
      - run: cargo build --release -p multihull
        working-directory: router
      - run: docker build -t multihull-mock-server:e2e testing/mock-server
      - run: uv sync --locked --project testing/e2e
      - run: >
          uv run --project testing/e2e pytest -q --timeout 600
          -c testing/e2e/pyproject.toml testing/e2e/tests
          --junitxml testing/e2e/e2e-results.xml --basetemp testing/e2e/e2e-tmp
        env:
          E2E_ROUTER_BIN: ${{ github.workspace }}/router/target/release/multihull
          E2E_MOCK_IMAGE: multihull-mock-server:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: |
            testing/e2e/e2e-tmp/**/*.log
            testing/e2e/e2e-tmp/**/*.toml
            testing/e2e/e2e-tmp/**/snapshot.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: testing/e2e/e2e-results.xml
          if-no-files-found: ignore
