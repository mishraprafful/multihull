name: Artifact Hub metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacthub-metadata
  cancel-in-progress: false

jobs:
  push-metadata:
    if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      CHART_REGISTRY: oci://ghcr.io/mishraprafful/charts
      ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2.0.2
        with:
          version: 1.3.4
      - name: Push the Artifact Hub metadata next to the chart
        run: |
          charts/artifacthub-metadata.sh "$ARTIFACTHUB_REPOSITORY_ID" "$RUNNER_TEMP/artifacthub"
          cd "$RUNNER_TEMP/artifacthub"
          oras push "${CHART_REGISTRY#oci://}/multihull:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          echo "Pushed charts/artifacthub-repo.yml for repository $ARTIFACTHUB_REPOSITORY_ID to ${CHART_REGISTRY#oci://}/multihull:artifacthub.io" >> "$GITHUB_STEP_SUMMARY"
