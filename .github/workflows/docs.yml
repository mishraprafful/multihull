name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PAGES_PROJECT: multihull
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: uv sync --project python --locked
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Skip deploy without Cloudflare secrets
        if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; built the site, skipped deploy."

      - name: Ensure Pages project exists
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if output=$(npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main 2>&1); then
            echo "$output"
          elif grep -qi 'already exists' <<<"$output"; then
            echo "Pages project $PAGES_PROJECT already exists"
          else
            echo "$output"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy website/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}

      - name: Comment preview URL
        if: env.CLOUDFLARE_CONFIGURED == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: docs-preview
          message: |
            Docs preview for ${{ github.event.pull_request.head.sha }}

            - Deployment: ${{ steps.deploy.outputs.deployment-url }}
            - Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url || 'none' }}
