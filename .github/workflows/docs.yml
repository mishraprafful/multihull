name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'python/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      cleanup_branch:
        description: Delete all preview deployments for this branch instead of deploying
        required: false
        default: ''

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    if: github.event.action != 'closed' && inputs.cleanup_branch == ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PAGES_PROJECT: multihull
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: uv sync --project python --locked
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Skip deploy without Cloudflare secrets
        if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; built the site, skipped deploy."

      - name: Ensure Pages project exists
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if output=$(npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main 2>&1); then
            echo "$output"
          elif grep -qi 'already exists' <<<"$output"; then
            echo "Pages project $PAGES_PROJECT already exists"
          else
            echo "$output"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy website/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }}

      - name: Comment preview URL
        if: env.CLOUDFLARE_CONFIGURED == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            Docs preview for ${{ github.event.pull_request.head.sha }}

            - Deployment: ${{ steps.deploy.outputs.deployment-url }}
            - Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url || 'none' }}

  cleanup-previews:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed') || inputs.cleanup_branch != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PAGES_PROJECT: multihull
      PREVIEW_BRANCH: ${{ inputs.cleanup_branch || github.head_ref }}
    steps:
      - name: Skip cleanup without Cloudflare secrets
        if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipped preview cleanup."

      - name: Delete preview deployments for branch
        id: cleanup
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_BRANCH" ] || [ "$PREVIEW_BRANCH" = "main" ]; then
            echo "::error::Refusing to clean up branch '$PREVIEW_BRANCH'"
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ids=()
          page=1
          while :; do
            body=$(curl -fsS "${auth[@]}" "$api?env=preview&per_page=25&page=$page")
            mapfile -t batch < <(jq -r --arg b "$PREVIEW_BRANCH" \
              '.result[] | select(.environment == "preview" and .deployment_trigger.metadata.branch == $b) | .id' <<<"$body")
            ids+=("${batch[@]}")
            total_pages=$(jq -r '.result_info.total_pages // 1' <<<"$body")
            [ "$(jq '.result | length' <<<"$body")" -eq 0 ] && break
            [ "$page" -ge "$total_pages" ] && break
            page=$((page + 1))
          done
          echo "Found ${#ids[@]} preview deployment(s) for $PREVIEW_BRANCH"
          for id in "${ids[@]}"; do
            curl -fsS -X DELETE "${auth[@]}" "$api/$id?force=true" >/dev/null
            echo "Deleted $id"
          done
          echo "deleted=${#ids[@]}" >> "$GITHUB_OUTPUT"

      - name: Update preview comment
        if: env.CLOUDFLARE_CONFIGURED == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            Docs preview removed after this PR was closed (${{ steps.cleanup.outputs.deleted }} deployment(s) deleted).
