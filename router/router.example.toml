listen = "0.0.0.0:8080"
admin_listen = "127.0.0.1:9090"
region = "eu"
node_id = "router-eu-1"
max_buffered_body_bytes = 1048576

[snapshot]
# file://PATH (or a bare path), grpcs://HOST:PORT for the hull controller stream,
# or https://URL polled every 10 s. A snapshot can carry provider credentials,
# so keep a snapshot file at mode 0600.
source = "file://./snapshot.json"
# For grpcs:// and https:// sources:
# ca = "/etc/multihull/discovery/ca.crt"           # trust only this CA bundle instead of the public roots
# client_cert = "/etc/multihull/discovery/tls.crt" # client certificate for mTLS, with client_key
# client_key = "/etc/multihull/discovery/tls.key"
# token_env = "MULTIHULL_DISCOVERY_TOKEN"          # env var holding the bearer token
# Plaintext grpc:// and http:// sources start only with insecure = true (local development).
# insecure = false

[tls]
cert = "/etc/multihull/tls/tls.crt"
key = "/etc/multihull/tls/tls.key"

[log]
format = "json"
filter = "info,router_proxy=debug"

# Every duration below is in seconds (floats allowed, except the whole-second
# windows ratio_window and budget_window). Each table is optional; the values
# shown are the defaults. Unknown keys are rejected on load.

[timeouts]
# Phase timeouts per upstream attempt.
connect = 2
first_byte = 30
idle = 60
total = 600

[circuit]
# Consecutive Transient or Fatal outcomes that open an endpoint circuit.
consecutive_failures = 5
# Or: error ratio above this over ratio_window once min_samples were seen.
error_ratio = 0.5
ratio_window = 10
min_samples = 20
# Open duration is base_backoff * 2^n capped at max_backoff, plus up to
# jitter_fraction of that value.
base_backoff = 5
max_backoff = 300
jitter_fraction = 0.25
# Half-open admission ramps 1 request, 5 percent, 25 percent, 100 percent across this window.
half_open_ramp = 30
# Successes of real requests admitted in half-open that close the circuit again.
# Probe successes never count.
probe_successes_to_close = 3
# A provider circuit opens when this share of its endpoint circuits is open.
provider_open_ratio = 0.5
# Panic threshold in (0, 1]: with more than this share of endpoints open, route to
# all of them. 1 disables panic routing.
panic_threshold = 0.5

[admission]
# Longest a request waits for a free slot before 429 with Retry-After.
max_wait = 5
# Waiting requests per route before new arrivals get 429 immediately.
bound = 1024

[pressure]
# Queue waits above max_wait * queue_wait_fraction count as pressure. A shorter
# wait ends the pressure only once no other request is left in the queue.
queue_wait_fraction = 0.5
# Pressure sustained for this long sends Degraded(QueueDepth) to the controller.
sustained = 2
# While pressure holds and new queue samples confirm it, Degraded is re-sent this
# often. Keep it well below the controller's --degraded-cooldown.
resend_every = 30
# Pressure forgotten after this long without samples.
stale_after = 10
# TTFT p95 above baseline * factor over ttft_window samples sends Degraded(TtftP95),
# re-sent every resend_every while new samples arrive, until a window is healthy again.
# The factor must be finite and greater than 1.
ttft_degrade_factor = 2.0
ttft_window = 50
# Only healthy windows move the baseline, by this share of the difference.
ttft_baseline_smoothing = 0.2
# A slowdown that lasts this long becomes the new baseline and stops Degraded(TtftP95).
# Longer keeps raised floors through long incidents; shorter accepts a permanent shift sooner.
ttft_rebaseline_after = 3600

[probe]
# Active health probe per endpoint: GET <endpoint url><health_path from the snapshot, default /health>.
enabled = true
# Seconds between probe rounds; each round is jittered by +-jitter_fraction.
interval = 5
timeout = 2
jitter_fraction = 0.2
# Consecutive failures that eject the endpoint (open its circuit) and consecutive
# successes that restore it. RunPod 204 (warming) and 429 count as neither.
failure_threshold = 3
success_threshold = 3

[retry]
# Retries allowed per route: budget_ratio of the requests seen in budget_window,
# plus min_retries_per_second * budget_window as a floor for low traffic.
budget_ratio = 0.2
budget_window = 10
min_retries_per_second = 10
