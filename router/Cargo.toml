[workspace]
resolver = "2"
members = [
    "crates/multihull",
    "crates/router-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mishraprafful/multihull"
homepage = "https://multihull.pages.dev"
documentation = "https://multihull.pages.dev"

[workspace.dependencies]
router-testkit = { path = "crates/router-testkit" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2", "server-graceful"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "logging"] }
webpki-roots = "1"
rcgen = "0.14"
tempfile = "3"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "channel"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
dashmap = "6"
matchit = "0.9"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
thiserror = "2"
anyhow = "1"
rand = "0.9"
notify = "8"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
bytes = "1"
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false }
