[package]
name = "router-cp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Control-plane snapshot sources for the Multihull router: gRPC stream, watched file, polled URL."
publish = false

[dependencies]
router-core = { workspace = true }
router-tls = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
router-testkit = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true, features = ["router"] }
