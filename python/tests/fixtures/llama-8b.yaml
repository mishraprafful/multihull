apiVersion: multihull/v1
name: llama-8b

container:
  image: ghcr.io/acme/vllm-llama:1.4.0
  command: ["vllm", "serve", "meta-llama/Llama-3.1-8B-Instruct"]
  port: 8000
  health: {path: /health, initialDelaySeconds: 120}
  env: {VLLM_LOGGING_LEVEL: INFO}
  secrets: [hf-token]

resources:
  gpu: [L4, A10G, A100-40]
  gpuCount: 1
  memory: 32Gi

scaling:
  concurrency: 32
  replicas: {min: 1, max: 8}

reliability:
  minWarmProviders: 2
  overprovision: 1.4
  fallbackScaleToZero: false
  spot: false

targets:
  - provider: gke-prod
    type: kubernetes
    priority: 1
    replicas: {min: 2}
    kubernetes: {context: gke_acme_europe-west4_prod, namespace: multihull}
  - provider: modal-main
    type: modal
    priority: 2
    modal: {environment: main, region: eu}
  - provider: runpod-eu
    type: runpod
    priority: 3
    runpod: {dataCenters: [EU-RO-1, EU-SE-1]}

route:
  hostname: llama.api.acme.com
  protocol: openai
  failover: {policy: priority, retryOn: [5xx, timeout, capacity], maxRetries: 2}
  auth: {apiKeys: {from: env:LLAMA_API_KEYS}}
