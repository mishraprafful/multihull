[project]
name = "multihull"
version = "0.0.1"
description = "Deploy always-warm GPU inference containers to many providers from one spec and fail over between them automatically."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Prafful Mishra" }]
keywords = ["gpu", "inference", "serving", "failover", "modal", "runpod", "kubernetes"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/mishraprafful/multihull"
Repository = "https://github.com/mishraprafful/multihull"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multihull"]
