[project]
name = "multihull"
version = "0.0.1"
description = "Deploy always-warm GPU inference containers to many providers from one spec and fail over between them automatically."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Prafful Mishra" }]
keywords = ["gpu", "inference", "serving", "failover", "modal", "runpod", "kubernetes"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "kubernetes>=29",
]

[project.optional-dependencies]
modal = ["modal>=0.64"]
blake3 = ["blake3>=0.4"]

[project.scripts]
hull = "multihull.cli:app"

[project.urls]
Homepage = "https://github.com/mishraprafful/multihull"
Repository = "https://github.com/mishraprafful/multihull"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multihull"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
